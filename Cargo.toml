[package]
name = "vane"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/inteniquetic/vane"

[target.'cfg(unix)'.dependencies]
# One setsockopt call (SO_RCVBUF); already in the tree transitively.
libc = "0.2"

[dependencies]
base64 = "0.22"
# Non-optional since the trust knobs: the H3 ctx-builder path (custom roots,
# mTLS) needs `boring::` types in every feature set, and quiche's default
# `boringssl-boring-crate` feature already links the crate unconditionally —
# this costs the no-default-features build nothing it wasn't paying.
boring = "4.22"
getrandom = "0.3"
psl = { version = "2", optional = true }
quiche = "0.29.1"
sha2 = "0.10"
uniffi = {version = "0.31", default-features = false}
thiserror = "2.0.12"
# TCP fallback backend. No gzip/deflate/brotli/zstd: the HTTP/3 path does no
# transparent decompression and the two transports must behave identically.
# No `cookies`: vane's own jar drives both transports.
reqwest = { version = "0.13", optional = true, default-features = false, features = ["blocking", "http2", "rustls-no-provider"] }
# Already in the tree via reqwest; direct only so the DNS resolver adapter can
# name `spawn_blocking` — the bridge that keeps a blocking resolve off
# reqwest's shared runtime thread. "rt" alone: no macros, no extra runtime.
tokio = { version = "1", optional = true, default-features = false, features = ["rt"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Platform trust (SecTrust on Apple, JNI on Android). rustls-native-certs was
# tried first and is dead on both: openssl-probe never looks in
# /system/etc/security/cacerts, and iOS ships no PEM bundle at all.
rustls-platform-verifier = { version = "0.7", optional = true }
# Wipes the retained client-certificate key PEM on drop (1.d key hygiene).
# Already in the tree via rustls-pki-types; direct so the HTTP/3-only build
# keeps the same hygiene.
zeroize = "1"

[features]
default = ["spki-pinning", "tcp-fallback", "psl"]
# The pin-verification code path; `boring` itself is now unconditional (see
# the dependency note), so this gates only vane's own code.
spki-pinning = []
# Public suffix list, so a `Set-Cookie: Domain=co.uk` is refused as well as
# `Domain=com`. Dropped by the small profile: it costs ~533 KB of embedded list
# for a feature that is off by default. The dot-and-IP-literal guard in
# `domain_is_assignable` ships in both profiles either way.
psl = ["dep:psl"]
tcp-fallback = ["dep:reqwest", "dep:tokio", "dep:rustls", "dep:rustls-platform-verifier", "dep:jni", "dep:log"]

# Android's trust store is only reachable over JNI, so the TCP path needs one
# `Context` handshake before its first handshake. Pinned to the same 0.22 the
# platform verifier itself depends on: `init_with_env` takes *its* `Env` type,
# so a second jni version in the tree would not typecheck. Optional and
# target-scoped, so --no-default-features links no JNI and no other platform
# sees it.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", optional = true, default-features = false }
# Facade only, and already in the tree via rustls-platform-verifier, so this
# costs no extra crate. Debug builds install a ~20-line logcat sink for it: the
# verifier reports *why* it rejected a certificate through `log::warn!`, and
# with no logger the `log` crate drops it. android_logger would do the same job
# but defaults to pulling in `regex`.
log = { version = "0.4", optional = true }

[dev-dependencies]
rcgen = "0.14"
# Lets the redirect tests synthesize a response so they can drive the real
# `redirect_target` instead of a copy of its logic.
http = "1"
# Randomized enforcement of the parser/decision invariants (src/proptests.rs).
# The release profile is `panic = "abort"`, so a panic reachable from
# peer-controlled bytes is a remote crash; these tests keep that class extinct
# on every `cargo test`. Dev-only — must never enter the shipping graph.
proptest = "1"

[lib]
crate-type = [
    "cdylib",    # android + UniFFI bindgen
    "staticlib", # ios static XCFramework
    "lib"
]
name = "vane"

[build-dependencies]
uniffi = { version = "0.31", features = ["build"] }

[profile.release]
opt-level = "z"
lto = "fat"
strip = true
codegen-units = 1
panic = "abort"
incremental = false
debug = false
overflow-checks = false

# PERFORMANCE_PLAN.md Phase 5a: size-first `opt-level = "z"` above applies to
# dependencies too, including hot Rust code that benefits from real
# optimization. `ring` (pulled in via rustls for the tcp-fallback path) was
# considered and deliberately left out: its AEAD/hash/curve primitives are
# hand-written assembly (`crypto/**/asm/*.pl`, `third_party/fiat/**/*.S`,
# selected by its build.rs per target arch), compiled by `cc`/an assembler and
# already outside rustc's opt-level control, so an override here would only
# touch its thin non-hot Rust glue -- same reasoning as BoringSSL's C code
# below, not speculative inclusion.
[profile.release.package.quiche]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
