[package]
name = "vane"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
boring = { version = "4.22", optional = true }
getrandom = "0.3"
quiche = "0.29.1"
sha2 = "0.10"
uniffi = {version = "0.29", default-features = false}
thiserror = "2.0.12"

[features]
default = ["spki-pinning"]
spki-pinning = ["dep:boring"]

[lib]
crate-type = [
    "cdylib",    # android + UniFFI bindgen
    "staticlib", # ios static XCFramework
    "lib"
]
name = "vane"

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

[profile.release]
opt-level = "z"
lto = "fat"
strip = true
codegen-units = 1
panic = "abort"
incremental = false
debug = false
overflow-checks = false
