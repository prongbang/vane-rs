[package]
name = "vane"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
boring = { version = "4.22", optional = true }
bytes = { version = "1.11", optional = true }
getrandom = "0.3"
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1.10", features = ["client", "http1", "http2"], optional = true }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-roots"], optional = true }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"], optional = true }
quiche = "0.29.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pki-types = { version = "1", optional = true }
sha2 = "0.10"
tokio = { version = "1.50", features = ["io-util", "rt-multi-thread", "time"], optional = true }
tokio-rustls = { version = "0.26", optional = true }
tower-service = { version = "0.3", optional = true }
uniffi = {version = "0.29", default-features = false}
thiserror = "2.0.12"
webpki-roots = { version = "1", optional = true }

[features]
default = ["http12", "spki-pinning"]
http12 = [
    "dep:bytes",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-rustls",
    "dep:hyper-util",
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:tokio",
    "dep:tokio-rustls",
    "dep:tower-service",
    "dep:webpki-roots",
]
spki-pinning = ["dep:boring"]

[lib]
crate-type = [
    "cdylib",    # android + UniFFI bindgen
    "staticlib", # ios static XCFramework
    "lib"
]
name = "vane"

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

[profile.release]
opt-level = "z"
lto = "fat"
strip = true
codegen-units = 1
panic = "abort"
incremental = false
debug = false
overflow-checks = false
